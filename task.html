<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Task Details</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="page">
    <header class="page-header">
        <h1 class="page-title">Task Details</h1>
    </header>

    <main>
        <section class="task-card">
            <h2 id="task-title" class="task-card-title"></h2>

            <p class="task-card-row">
                <span class="task-card-label">Status:</span>
                <span id="task-status" class="task-card-status"></span>
            </p>
        </section>

        <button class="btn-back" onclick="history.back()">Back</button>
    </main>
</div>

<script src="js/taskInfo.js" type="module"></script>
</body>
</html>
